# =============================================================================
# Ansible inventory dla SOC Home Lab
# Uruchomienie:  ansible -i inventory.yml all -m ping
# =============================================================================

all:
  children:

    # -------------------------------------------------------------------------
    # Wazuh manager — sam serwer SIEM (zazwyczaj nie wymaga playbook'a,
    # bo postawiony przez Vagranta. Tutaj tylko dla weryfikacji łączności.)
    # -------------------------------------------------------------------------
    wazuh_servers:
      hosts:
        wazuh-srv:
          ansible_host: 192.168.10.10
          ansible_user: vagrant
          ansible_ssh_private_key_file: ../vagrant/.vagrant/machines/wazuh-srv/virtualbox/private_key
          ansible_python_interpreter: /usr/bin/python3

    # -------------------------------------------------------------------------
    # Agenci Linux (na razie pusty — przykład dla rozszerzenia)
    # -------------------------------------------------------------------------
    linux_agents:
      hosts: {}

    # -------------------------------------------------------------------------
    # Agenci Windows — DC01 i WS01
    # -------------------------------------------------------------------------
    windows_agents:
      hosts:
        dc01:
          ansible_host: 192.168.20.10
          agent_group: domain_controllers
        ws01:
          ansible_host: 192.168.20.20
          agent_group: workstations
      vars:
        # UWAGA — to NIE jest wyciek sekretu.
        #
        # `vagrant/vagrant` to publicznie znane, domyślne dane logowania obrazów
        # bazowych Vagranta. Każdy, kto pobierze ten sam box, ma dokładnie te
        # same. Trzymanie ich w repozytorium nie zmniejsza bezpieczeństwa —
        # zmniejszyłoby je dopiero użycie tego inwentarza poza laboratorium.
        #
        # Lab działa w odizolowanych sieciach 192.168.x (patrz docs/01-architecture.md)
        # i nie jest wystawiony na zewnątrz. Do czegokolwiek trwałego:
        # zmień hasła po provisioningu, przełącz WinRM na HTTPS z walidacją
        # certyfikatu i trzymaj poświadczenia w Ansible Vault
        # (`ansible-vault encrypt_string`), a nie w inwentarzu.
        ansible_user: vagrant
        ansible_password: vagrant
        ansible_connection: winrm
        ansible_winrm_transport: basic
        ansible_winrm_server_cert_validation: ignore
        ansible_port: 5985
