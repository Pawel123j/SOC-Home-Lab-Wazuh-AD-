# =============================================================================
# Role: wazuh-agent-linux
# Instaluje agenta Wazuh na Ubuntu/Debian.
# Zarezerwowane dla przyszłej rozbudowy labu (np. dodanie serwera Apache).
# =============================================================================

- name: "Sprawdź, czy agent jest już zainstalowany"
  ansible.builtin.stat:
    path: /var/ossec/bin/wazuh-control
  register: wazuh_installed

- name: "Pobierz pakiet DEB"
  ansible.builtin.get_url:
    url: "{{ wazuh_deb_url }}"
    dest: /tmp/wazuh-agent.deb
    mode: '0644'
  when: not wazuh_installed.stat.exists

- name: "Zainstaluj pakiet z parametrami enrollment"
  ansible.builtin.apt:
    deb: /tmp/wazuh-agent.deb
  environment:
    WAZUH_MANAGER: "{{ wazuh_manager_ip }}"
    WAZUH_REGISTRATION_SERVER: "{{ wazuh_manager_ip }}"
    WAZUH_AGENT_GROUP: "{{ agent_group | default('default') }}"
    WAZUH_AGENT_NAME: "{{ inventory_hostname }}"
  become: true
  when: not wazuh_installed.stat.exists

- name: "Usuń pobrany pakiet"
  ansible.builtin.file:
    path: /tmp/wazuh-agent.deb
    state: absent

- name: "Włącz i uruchom usługę"
  ansible.builtin.systemd:
    name: wazuh-agent
    enabled: true
    state: started
  become: true

- name: "Sprawdź status połączenia z managerem"
  ansible.builtin.command: /var/ossec/bin/agent_control -i 000
  become: true
  register: agent_status
  changed_when: false
  failed_when: false
