name: Walidacja detekcji

# To repozytorium nie zawiera aplikacji do zbudowania — jego produktem są
# reguły detekcyjne, infrastruktura jako kod i scenariusze ataków. Bramka
# sprawdza więc to, czego zepsucie realnie boli: niepoprawną regułę, zerwany
# łańcuch if_sid, zduplikowane ID albo syntetyczne zdarzenie, na którym żadna
# reguła nie ma szans strzelić.
#
# Czego ta bramka NIE robi: nie uruchamia Wazuha, więc nie potwierdza, że
# reguła faktycznie strzeli. Do tego służy kontener z managerem
# (infrastructure/docker/) — patrz HUMAN_ACTION_REQUIRED.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detections:
    name: Reguły Wazuh, Sigma i zdarzenia testowe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instalacja zależności
        run: pip install -r requirements-test.txt

      - name: Walidacja treści detekcyjnych
        run: python3 scripts/validate_detections.py

      - name: PCRE2 na realistycznych polach i próbkach negatywnych
        run: python3 -m pytest -q tests

      # Dokumentacja opisująca detekcje rozjeżdża się z regułami po cichu:
      # reguła dostaje inny próg, a zdanie w dokumencie zostaje stare. W repo
      # o bezpieczeństwie to kosztuje wiarygodność całego zestawu reguł, więc
      # zgodność jest pilnowana maszynowo, a nie pamięcią.
      - name: Zgodność dokumentacji z regułami
        run: python3 scripts/validate_docs_against_rules.py

  iac:
    name: Infrastruktura jako kod
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instalacja zależności
        run: pip install -r infrastructure/ansible/requirements-controller.txt "pyyaml>=6,<7"

      - name: Kolekcje Ansible
        run: ansible-galaxy collection install -r infrastructure/ansible/requirements.yml

      - name: Składnia playbooka i moduły Ansible
        working-directory: infrastructure/ansible
        run: ansible-playbook -i inventory.yml site.yml --syntax-check

      - name: Składnia Vagrantfile
        run: ruby -c infrastructure/vagrant/Vagrantfile

      - name: Składnia PowerShell i przepływ etapów Windows (mocki)
        shell: pwsh
        run: ./tests/test_windows_provisioning.ps1

      # Literówka w playbooku Ansible albo w compose ujawnia się dziś dopiero
      # po 25 minutach stawiania labu. Parsowanie kosztuje sekundę.
      - name: Poprawność YAML (Ansible, compose)
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml

          roots = ["infrastructure", ".github"]
          failures = []
          checked = 0

          for root in roots:
              for path in sorted(pathlib.Path(root).rglob("*.yml")) + sorted(pathlib.Path(root).rglob("*.yaml")):
                  checked += 1
                  try:
                      # Ansible i compose potrafią mieć wiele dokumentów w pliku.
                      list(yaml.safe_load_all(path.read_text(encoding="utf-8")))
                  except yaml.YAMLError as exc:
                      failures.append(f"{path}: {exc}")

          print(f"Sprawdzono {checked} plików YAML")
          for failure in failures:
              print(f"  - {failure}", file=sys.stderr)
          sys.exit(1 if failures else 0)
          PY

      - name: Poprawność składni skryptów powłoki
        run: |
          set -e
          for script in $(git ls-files '*.sh'); do
            bash -n "$script" && echo "OK $script"
          done

  compose:
    name: Walidacja harnessu Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Harness z Wazuh managerem jest lekką alternatywą dla pełnego labu na
      # VM-ach. Sprawdzamy, że plik compose jest poprawny — postawienie samego
      # managera i odpalenie 9 zdarzeń opisuje HUMAN_ACTION_REQUIRED.md.
      - name: docker compose config
        working-directory: infrastructure/docker
        run: docker compose config -q
        env:
          WAZUH_API_PASSWORD: ci-config-validation-only-not-a-runtime-password
